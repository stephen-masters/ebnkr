# Dependabot keeps the npm development tooling and the workflow actions
# current. Commit-message prefixes are set so its PRs satisfy the
# Conventional Commits hook that local commits go through (Dependabot commits
# on GitHub's side bypass it).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint 8 supports TypeScript only below 6.1, so TypeScript
      # 7 breaks `npm ci`. Remove this once typescript-eslint's peer range
      # includes 7: check with `npm view typescript-eslint peerDependencies`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
